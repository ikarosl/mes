name: easy-mes

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    command:
      - --default-time-zone=+08:00
      - --log-bin-trust-function-creators=1
    env_file:
      - /etc/easy-mes/mysql.env
    ports:
      # 数据库客户端维护入口；安全组仅允许维护 IP。
      - ${MYSQL_BIND_ADDRESS:-0.0.0.0}:${MYSQL_PORT:-13306}:3306
    volumes:
      - type: bind
        source: /srv/easy-mes/mysql
        target: /var/lib/mysql
      - type: bind
        source: /srv/easy-mes/backups/mysql
        target: /backups/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/aistor/minio:RELEASE.2026-04-14T21-32-45Z}
    command:
      - minio
      - server
      - /mnt/data
      - --license
      - /run/secrets/minio.license
      - --console-address
      - :9001
    env_file:
      - /etc/easy-mes/minio.env
    ports:
      # 控制台维护入口；安全组仅允许维护 IP，S3 API 9000 不发布到宿主机。
      - ${MINIO_CONSOLE_BIND_ADDRESS:-0.0.0.0}:${MINIO_CONSOLE_PORT:-19001}:9001
    volumes:
      - type: bind
        source: /srv/easy-mes/minio
        target: /mnt/data
      - type: bind
        source: /srv/easy-mes/backups/minio
        target: /backups/minio
      - type: bind
        source: /etc/easy-mes/minio.license
        target: /run/secrets/minio.license
        read_only: true
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://127.0.0.1:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

  api:
    image: ${API_IMAGE:-easy-mes-api:release-not-configured}
    env_file:
      - /etc/easy-mes/api.env
    environment:
      APP_PORT: ${API_PORT:-3000}
      # 部署入口固定使用 HTTPS，Refresh Cookie 仅通过 HTTPS 发送。
      REFRESH_TOKEN_COOKIE_SECURE: 'true'
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:'+process.env.APP_PORT+'/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    restart: unless-stopped
    networks:
      - backend

  web:
    image: ${WEB_IMAGE:-easy-mes-web:release-not-configured}
    # 官方启动入口根据端口和服务地址生成容器内的 HTTPS 配置。
    environment:
      WEB_LISTEN_PORT: ${WEB_LISTEN_PORT:-8091}
      API_PORT: ${API_PORT:-3000}
      TLS_SERVER_NAME: ${TLS_SERVER_NAME:?Set TLS_SERVER_NAME to the certificate public IPv4 or DNS name}
      HTTPS_PORT: ${HTTPS_PORT:-8091}
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 宿主机绑定地址和端口由 /etc/easy-mes/deploy.env 配置。
      # 左宿主机端口，右容器端口
      - ${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:${WEB_LISTEN_PORT:-8091}
      - ${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-8091}:443
    volumes:
      - type: bind
        source: /srv/easy-mes/nginx-logs
        target: /var/log/nginx
      - type: bind
        source: /etc/letsencrypt
        target: /etc/letsencrypt
        read_only: true
      - type: bind
        source: /srv/easy-mes/acme-challenge
        target: /var/www/acme
        read_only: true
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=/dev/null
        - http://127.0.0.1:${WEB_LISTEN_PORT:-8091}/api/health/live
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    driver: bridge
