services:
  mysql:
    image: mysql:8.4
    command: --default-time-zone=+08:00
    environment:
      MYSQL_DATABASE: ${TEST_DB_NAME:-easy_mes_test}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports: ['${TEST_DB_PORT:-3307}:3306']
    volumes: ['mysql-integration-data:/var/lib/mysql']
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    profiles: ['optional']
    ports: ['6379:6379']
  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2026-04-14T21-32-45Z
    command:
      ['minio', 'server', '/mnt/data', '--license', '/minio.license', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    ports: ['9000:9000', '9001:9001']
    volumes:
      - minio-data:/mnt/data
      - ./secrets/minio.license:/minio.license:ro
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  mysql-integration-data:
  minio-data:
